<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku Ya.. 🧡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="layar-awal">
        <div class="kartu-awal">
            <img src="https://media.tenor.com/tE_7u8v-H0YAAAAi/nailong-milk-tea.gif" alt="Loading" class="img-loading">
            <p>Nailong sudah siap! ✨</p>
            <button id="btn-masuk">Masuk 🧡</button>
        </div>
    </div>

    <div id="konten-utama" style="display: none;">
        <h1 id="judul">Maafin Aku Ya.. </h1>
        <img src="nailong.png" class="gambar-nailong" alt="Nailong">
        <p id="pesan-teks">Klik tombol di bawah ini...</p>
        
        <button id="btn-lanjut">Mulai </button>

        <div class="area-game" id="seksi-game" style="display: none;">
            <p>Ayo aduk matchanya sampai berbusa! 🍵</p>
            <div id="mangkuk-matcha">
                <div id="air-matcha"></div>
                <img src="https://cdn-icons-png.flaticon.com/512/5029/5029198.png" id="pengaduk" alt="Whisk">
            </div>
            <p id="info-skor">Tingkat Aduk: 0%</p>
        </div>

        <div id="seksi-akhir" style="display: none;">
            <p class="teks-akhir">Mau maafin aku kan? </p>
            <div class="btn-group">
                <button id="btn-iya">Iya, Maafin </button>
                <button id="btn-engga">Engga! </button>
            </div>
        </div>
    </div>

    <audio id="musik" src="sound.mp3" loop></audio>
    <div id="wadah-hati"></div>

    <script src="script.js"></script>
</body>
</html>
