<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maafin Aku </title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="loadingBox">
    <img src="loading.gif">
    <p>Nailong lagi nyiapin sesuatu 🧡</p>
    <button onclick="masuk()">Masuk 🧡</button>
  </div>

  <audio id="loadingSound" src="backsound.mp3" loop></audio>
</div>

<!-- MAIN -->
<div class="container" id="main">

  <h1 id="title">Maafin Aku Ya </h1>

  <img src="nailong.png" class="nailong">

  <p id="text">Klik mulai ya 🧡</p>

  <button onclick="nextText()">Mulai </button>

  <div id="game" style="display:none;">
    <h2>🍵 Game Matcha</h2>
    <p>Klik bar hijau saat muncul!</p>

    <div id="barArea">
      <div id="bar"></div>
    </div>

    <p id="score">Score: 0</p>
  </div>

  <div id="choice" style="display:none;">
    <p>Kamu mau maafin aku? </p>

    <button onclick="yes()">Iya </button>
    <button onclick="no()" id="noBtn">Engga </button>
  </div>

</div>

<div id="hearts"></div>

<audio id="bgm" src="music.mp3" loop></audio>
<audio id="sound" src="sound.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
