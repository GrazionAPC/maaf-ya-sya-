<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku 🧡</title>
    <style>
        /* CSS LANGSUNG DI SINI */
        body {
            margin: 0;
            font-family: sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(90deg, orange 50%, white 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .container {
            display: none; /* Awalnya sembunyi */
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #fff9e6;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            border: none;
            background: #ff6600;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .nailong { width: 200px; margin: 20px; }

        #barArea {
            width: 200px; height: 25px;
            background: #ddd;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
        }
        #bar { width: 0%; height: 100%; background: limegreen; }

        #noBtn { transition: 0.2s; }
    </style>
</head>
<body>

    <div id="loading">
        <div style="background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
            <p>Nailong lagi nyiapin sesuatu 🧡</p>
            <button onclick="masuk()">Masuk Sekarang 🧡</button>
        </div>
    </div>

    <div class="container" id="main">
        <h1 id="title">Maafin Aku </h1>
        <img src="nailong.png" class="nailong">
        <p id="text">Klik mulai ya 🧡</p>
        <button id="btnMulai" onclick="nextText()">Mulai </button>

        <div id="game" style="display:none;">
            <p>Klik saat hijau muncul!</p>
            <div id="barArea"><div id="bar"></div></div>
            <p id="score">Score: 0</p>
        </div>

        <div id="choice" style="display:none;">
            <p>Kamu mau maafin aku? </p>
            <button onclick="yes()">Iya </button>
            <button onclick="no()" id="noBtn">Engga </button>
        </div>
    </div>

    <audio id="sound" src="sound.mp3"></audio>

    <script>
        /* JAVASCRIPT LANGSUNG DI SINI */
        
        // Fungsi Masuk (Anti Gagal)
        function masuk() {
            console.log("Fungsi masuk dipanggil");
            document.getElementById("loading").style.display = "none";
            document.getElementById("main").style.display = "flex";
            
            // Putar musik
            var audio = document.getElementById("sound");
            audio.play().catch(function(error) {
                console.log("Autoplay diblokir browser, musik akan main setelah klik lain.");
            });
        }

        // Ambil Nama dari URL
        const params = new URLSearchParams(window.location.search);
        const nama = params.get("nama") || "Nathasya";
        document.getElementById("title").innerText = "Maafin Aku Ya " + nama ";

        let texts = ["Aku tau aku salah", "Jangan marah lagi ya..."];
        let i = 0;

        function nextText() {
            if (i < texts.length) {
                document.getElementById("text").innerText = texts[i];
                i++;
            } else {
                document.getElementById("btnMulai").style.display = "none";
                document.getElementById("game").style.display = "block";
                mulaiGame();
            }
        }

        let score = 0;
        function mulaiGame() {
            setInterval(() => {
                let bar = document.getElementById("bar");
                let val = Math.random() * 100;
                bar.style.width = val + "%";
                bar.dataset.active = val > 70 ? "true" : "false";
            }, 800);

            document.getElementById("barArea").onclick = function() {
                let isActive = document.getElementById("bar").dataset.active === "true";
                score += isActive ? 25 : -10;
                document.getElementById("score").innerText = "Score: " + score;
                if (score >= 100) {
                    document.getElementById("game").style.display = "none";
                    document.getElementById("choice").style.display = "block";
                }
            };
        }

        function yes() {
            window.location.href = "https://wa.me/628116502810?text=Iya aku maafin 🧡";
        }

        function no() {
            let btn = document.getElementById("noBtn");
            btn.style.position = "fixed";
            btn.style.left = Math.random() * 80 + "vw";
            btn.style.top = Math.random() * 80 + "vh";
        }
    </script>
</body>
</html>
