<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku </title>
    <style>
        /* ===== CSS ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #fff;
            overflow-x: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, orange 50%, #fff 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loadingBox {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .container {
            display: none; /* Sembunyi di awal */
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: repeating-linear-gradient(45deg, #fff9e6, #fff9e6 20px, #ffffff 20px, #ffffff 40px);
        }

        .nailong { width: 220px; margin-bottom: 20px; transition: 0.3s; }
        .nailong:hover { transform: scale(1.05); }

        button {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            background: #ff6600;
            color: white;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }

        #barArea {
            width: 250px; height: 30px;
            background: #eee;
            margin: 20px auto;
            border-radius: 20px;
            border: 3px solid #ff6600;
            overflow: hidden;
        }

        #bar { width: 0%; height: 100%; background: #4CAF50; transition: width 0.1s; }

        #hearts span {
            position: fixed; top: -20px;
            animation: fall 4s linear forwards;
            z-index: 1000;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="loadingBox">
            <img src="loading.gif" alt="" style="width: 100px; margin-bottom: 10px;">
            <p style="font-weight: bold;">Nailong lagi nyiapin sesuatu 🧡</p>
            <button onclick="masuk()">Masuk </button>
        </div>
    </div>

    <div class="container" id="main">
        <h1 id="title">Maafin Aku </h1>
        <img src="nailong.png" class="nailong">
        <p id="text" style="font-size: 18px; color: #555;">Klik mulai ya 🧡</p>
        
        <button id="btnMulai" onclick="nextText()">Mulai </button>

        <div id="game" style="display:none;">
            <p>Klik saat bar jadi <b>HIJAU!</b></p>
            <div id="barArea"><div id="bar"></div></div>
            <p id="score" style="font-weight: bold;">Score: 0</p>
        </div>

        <div id="choice" style="display:none;">
            <p style="font-size: 20px;">Kamu mau maafin aku? </p>
            <button onclick="yes()">Iya </button>
            <button id="noBtn" onclick="no()" style="background: #cc0000;">Engga </button>
        </div>
    </div>

    <audio id="sound" src="sound.mp3"></audio>
    <div id="hearts"></div>

    <script>
        /* ===== JAVASCRIPT ===== */

        // 1. Fungsi Masuk (Diletakkan paling luar agar terbaca)
        function masuk() {
            document.getElementById("loading").style.display = "none";
            document.getElementById("main").style.display = "flex";
            
            // Putar musik (opsional)
            let sfx = document.getElementById("sound");
            sfx.play().catch(() => console.log("Autoplay ditolak browser"));
        }

        // 2. Logic Nama dari URL
        const params = new URLSearchParams(window.location.search);
        const nama = params.get("nama") || "Nathasya";
        document.getElementById("title").innerText = "Maafin Aku Ya " + nama ";

        // 3. Logic Story
        let texts = [
            "Aku tau aku salah, maaf ya ",
            "Gak bermaksud gitu",
            "Maafin aku ya? "
        ];
        let step = 0;

        function nextText() {
            if (step < texts.length) {
                document.getElementById("text").innerText = texts[step];
                step++;
            } else {
                document.getElementById("btnMulai").style.display = "none";
                document.getElementById("game").style.display = "block";
                jalankanGame();
            }
        }

        // 4. Logic Game Matcha
        let score = 0;
        let isActive = false;

        function jalankanGame() {
            setInterval(() => {
                let bar = document.getElementById("bar");
                let val = Math.random() * 100;
                bar.style.width = val + "%";
                
                if (val > 70) {
                    bar.style.background = "#4CAF50"; // Hijau
                    isActive = true;
                } else {
                    bar.style.background = "#ff4d4d"; // Merah
                    isActive = false;
                }
            }, 800);

            document.getElementById("barArea").onclick = function() {
                if (isActive) {
                    score += 25;
                } else {
                    score -= 10;
                    if (score < 0) score = 0;
                }
                document.getElementById("score").innerText = "Score: " + score;

                if (score >= 100) {
                    document.getElementById("game").style.display = "none";
                    document.getElementById("choice").style.display = "block";
                }
            };
        }

        // 5. Logic Tombol Akhir
        function yes() {
            window.location.href = "https://wa.me/628116502810?text=Iya aku maafin kamu ";
        }

        function no() {
            let btn = document.getElementById("noBtn");
            btn.style.position = "fixed";
            btn.style.left = Math.random() * 80 + "vw";
            btn.style.top = Math.random() * 80 + "vh";
        }

        // 6. Efek Hati
        setInterval(() => {
            const h = document.createElement("span");
            h.innerHTML = "🧡";
            h.style.left = Math.random() * 100 + "vw";
            h.style.fontSize = Math.random() * 20 + 10 + "px";
            document.getElementById("hearts").appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }, 600);
    </script>
</body>
</html>
