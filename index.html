<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="layar-awal">
        <div class="box">
            <p>Nailong sedang menyiapkan alat.</p>
            <button id="btn-masuk">Bantu Nailong</button>
        </div>
    </div>

    <div id="konten-utama" style="display: none;">
        <h1 id="judul">Maaf</h1>
        
        <div id="cerita-wrapper">
            <img src="nailong.png" class="img-nailong">
            <p id="teks-cerita">Aku ingin membuatkan sesuatu untukmu.</p>
            <button id="btn-lanjut">Apa itu?</button>
        </div>

        <div id="seksi-game" style="display: none;">
            <h3>Aduk matcha sampai berbusa</h3>
            <p>Klik mangkuk dengan cepat</p>
            
            <div id="mangkuk-area">
                <div id="matcha-liquid"></div>
                <div id="matcha-foam"></div>
            </div>

            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <p>Proses: <span id="persen">0</span>%</p>
        </div>

        <div id="seksi-akhir" style="display: none;">
            <img src="matcha.png" class="img-matcha">
            <h2>Matcha untuk kamu</h2>
            <p>Apakah kamu mau memaafkanku?</p>
            <div class="btn-group">
                <button id="btn-iya">Iya</button>
                <button id="btn-engga">Tidak</button>
            </div>
        </div>
    </div>

    <audio id="musik" src="sound.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
