<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maafin Aku </title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <img src="loading.gif">
  <p id="loadingText">Nailong lagi nyiapin sesuatu buat kamu... 🧡</p>
  <button onclick="masuk()">Masuk </button>
  <audio id="bgm" src="music.mp3" loop></audio>
</div>

<!-- MAIN -->
<div class="container" id="main" style="display:none;">
  <h1 id="title">Maafin Aku Ya </h1>

  <img src="nailong.png" class="nailong">

  <p id="text">Klik dulu </p>

  <button onclick="nextText()">Mulai </button>

  <!-- GAME -->
  <div id="game" style="display:none;">
    <h2>Bikin Matcha buat Nailong 🍵</h2>
    <img src="matcha.png" id="matcha" onclick="clickMatcha()">
    <p id="progress">0%</p>
  </div>

  <!-- PILIHAN -->
  <div class="choice" id="choice" style="display:none;">
    <p>Kamu mau maafin aku gak? </p>
    <button onclick="yes()">Iya 💖</button>
    <button onclick="no()" id="noBtn">Engga </button>
  </div>
</div>

<div id="hearts"></div>

<audio id="sound" src="sound.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
