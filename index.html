<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nailong Maafin Aku </title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <img src="loading.gif">
  <p id="loadText">Nailong lagi nyiapin sesuatu buat kamu 🧡</p>
  <button onclick="masuk()">Masuk 🧡</button>

  <!-- SOUND LOADING (KICAU MANIA) -->
  <audio id="loadingSound" src="backsound.mp3" autoplay loop></audio>
</div>

<!-- MAIN -->
<div class="container" id="main" style="display:none;">

  <h1 id="title">Maafin Aku Ya </h1>

  <img src="nailong.png" class="nailong">

  <p id="text">Klik mulai ya 🧡</p>

  <button onclick="nextText()">Mulai </button>

  <!-- GAME -->
  <div id="game" style="display:none;">
    <h2>🍵 Mini Game: Bikin Matcha Untuk Nailong</h2>
    <p>⚡ Klik cepat saat bar hijau muncul!</p>

    <div id="barArea">
      <div id="bar"></div>
    </div>

    <p id="score">Score: 0</p>
  </div>

  <!-- CHOICE -->
  <div id="choice" style="display:none;">
    <p id="finalText">Kamu mau maafin aku gak? </p>

    <button onclick="yes()">Iya </button>
    <button onclick="no()" id="noBtn">Engga </button>
  </div>

</div>

<div id="hearts"></div>

<audio id="bgm" src="music.mp3" loop></audio>
<audio id="sound" src="sound.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
